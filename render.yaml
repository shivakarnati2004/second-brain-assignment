databases:
  - name: second-brain-db
    plan: free
    databaseName: second_brain
    user: second_brain_user

services:
  - type: web
    name: second-brain
    runtime: node
    plan: free
    autoDeploy: true
    buildCommand: npm ci && npm run build
    startCommand: npm run db:init && npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: second-brain-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: PUBLIC_BRAIN_API_KEY
        sync: false
      - key: NEXT_PUBLIC_PUBLIC_BRAIN_API_KEY
        sync: false
      - key: PUBLIC_BRAIN_ALLOWED_ORIGINS
        sync: false
